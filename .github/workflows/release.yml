name: Radar System Release

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: radar-system-release
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/digao791/radar-system

jobs:

  release:
    name: Build and Publish Docker Image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.full
          platforms: linux/amd64
          load: true
          push: false

          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

          labels: |
            org.opencontainers.image.title=Radar System
            org.opencontainers.image.description=Ada Radar Simulation and React Dashboard
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

          cache-from: type=gha,scope=radar-full
          cache-to: type=gha,mode=max,scope=radar-full

      - name: Smoke Test
        run: |
          set -euo pipefail

          docker run -d \
            --name radar-smoke \
            -p 127.0.0.1:8080:80 \
            "$IMAGE_NAME:latest"

          echo "Checking Radar API..."

          curl --fail --silent --show-error \
            --retry 30 \
            --retry-all-errors \
            --retry-delay 2 \
            --max-time 5 \
            http://localhost:8080/api/radar/status

          echo "Checking React Dashboard..."

          curl --fail --silent --show-error \
            --max-time 5 \
            http://localhost:8080/ \
            --output /dev/null

          echo "Smoke tests passed."

      - name: Container Logs
        if: always()
        run: docker logs radar-smoke || true

      - name: Cleanup
        if: always()
        run: docker rm -f radar-smoke || true

      - name: Publish Docker Image
        run: |
          set -euo pipefail

          docker push "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:latest"

      - name: Release Summary
        run: |
          {
            echo "## Radar System Release"
            echo ""
            echo "Docker image successfully published."
            echo ""
            echo "### Image tags"
            echo "- \`$IMAGE_NAME:latest\`"
            echo "- \`$IMAGE_NAME:${{ github.sha }}\`"
            echo ""
            echo "### Run the application"
            echo '```bash'
            echo "docker run -d --name radar-system -p 8080:80 $IMAGE_NAME:latest"
            echo '```'
            echo ""
            echo "Access: http://localhost:8080"
          } >> "$GITHUB_STEP_SUMMARY"