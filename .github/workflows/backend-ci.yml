name: Ada Backend CI

on:
  workflow_call:

permissions:
  contents: read

jobs:

    build-and-test:
      name: Build and Unit Tests
      runs-on: ubuntu-latest

      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup Alire
          uses: alire-project/setup-alire@v6

        - name: Select GNAT Toolchain
          run : | 
            alr toolchain --select gnat_native=15.3.1 gprbuild

        - name : Show toolchain
          run  : |
            alr --version 
            alr toolchain

        - name: Prepare Reports Directory
          run: mkdir -p reports/backend

        - name : Build backend
          run  : |
            set -o pipefail
            alr -n build 2>&1 | tee reports/backend/build.log

        - name : Run AUnit Tests
          working-directory: tests
          run  : |
            set -o pipefail
            alr -n run 2>&1 | tee ../reports/backend/tests.log

        - name: Upload Backend Reports
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: backend-reports
            path: reports/backend/
            retention-days: 14
